# Keyless real-executor composition: the routed task dispatches through the
# in-process model adapter (`supervisor-spawn`), whose `prepare()` reserves the
# child identity for the host gate and whose `start()` runs one replayed model
# turn inside the registered project's workspace. The routed child is the only
# model caller, so the single recorded script binds to it.

- id: persistence
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'
    compression: none

- id: settings
  name: '@deepseek-ai/dsh-settings-file'

# file defaults to $DSH_SNAPSHOT_FILE; with no provider catalog the replay
# keeps its catch-all waterfall, which answers the child's routed call.
- id: replay
  name: '@deepseek-ai/dsh-llm-replay'

- id: agent
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents: []
    workspaceContext: false
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

# Slash-command surface used by the driver for owner operations.
- id: commands
  name: '@deepseek-ai/dsh-commands'

- id: supervisor
  name: '@deepseek-ai/dsh-supervisor'
- id: supervisor-session
  name: '@deepseek-ai/dsh-supervisor-session'
- id: supervisor-project-registry
  name: '@deepseek-ai/dsh-supervisor-project-registry'
- id: supervisor-project-host
  name: '@deepseek-ai/dsh-supervisor-project-host'
- id: supervisor-executors
  name: '@deepseek-ai/dsh-supervisor-executor-subagent'
- id: supervisor-executor-inprocess
  name: '@deepseek-ai/dsh-supervisor-executor-inprocess'
  config:
    providerName: supervisor-spawn
    providers: [deepseek]
    permissions: [none, read]
- id: supervisor-orchestrator
  name: '@deepseek-ai/dsh-supervisor-orchestrator'
  config:
    maxRepairAttempts: 2
    autoDispatch: true
    retryOnFailure: true
- id: supervisor-memory
  name: '@deepseek-ai/dsh-supervisor-memory'
  config:
    maxSummaryChars: 1200
    maxBriefSummaries: 12
    maxBriefNotifications: 12
    compactionThreshold: 0.75
- id: supervisor-interaction
  name: '@deepseek-ai/dsh-tool-supervisor'
  config:
    wakeupOnNotification: false

# Reads the profile routing policy the scenario writes under
# `$DSH_HOME/profiles/supervisor/supervisor-routing.yml`.
- id: supervisor-routing
  name: './tests/fixtures/supervisor-router.mjs'
