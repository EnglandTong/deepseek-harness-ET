# LEGACY leaf (alpha.4 anchoring): the bundled runtime launches
# `dsh --profile sdk` and composes from its bundled bundle layers
# ($DSH_BUNDLED_RUNTIME_DIR/config), so this file is no longer loaded by the
# packaged app's runtime. Kept as the Plugins tab's legacy leaf view for the
# stdio-deepseek profile. Composition reference:
# packages/bundle/sdk-minimal/cordis.yml.

# Stdio JSON-RPC serving surface.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine; mounts the llm runtime and the loop, and requires an explicit
# `workspaceContext` (Config | false) because it changes model-visible input.
# `false` = hermetic prompts (no workspace overview injected).
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false

# Native DeepSeek adapter; the key resolves per request through the
# credential seam. Thinking pinned on for the shell's reasoning fold.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled

# Managed child-process groups for the bash executor; required by the spine.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

# JSONL persistence; $DSH_SESSION_ROOT points at the shell's per-user
# sessions directory (the bundled profile sets it before spawn).
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this policy selects the request,
# tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Model-facing filesystem stack: backend + observation policy + tools, with
# the workspace rooted at $DSH_CWD (the shell passes the user workspace).
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
