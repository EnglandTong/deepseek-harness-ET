# LEGACY leaf (alpha.4 anchoring): the sdk profile composes from
# $DSH_HOME/profiles/sdk bundle layers and takes no leaf argv, so the runtime
# never loads this file directly. It remains as the Plugins tab's legacy leaf
# view (fs-parse, static validation, boot history) for the stdio-deepseek
# profile.
#
# Stdio JSON-RPC serving config with the real DeepSeek adapter. Needs
# DEEPSEEK_API_KEY in the environment (the desktop shell passes it through on
# spawn) or in `.env` at the DSH runtime root. Composition mirrors
# packages/bundle/sdk-minimal/cordis.yml, the maintained sdk composition
# reference, with hermetic prompts for the desktop shell.
#
# The JSON-RPC server mounts the DeepSeek adapter itself at initialize when
# the client announces provider "deepseek-official" and no adapter is mounted;
# this leaf pins one anyway so thinking stays enabled (the shell's reasoning
# fold is the headline visualization) regardless of the server fallback.

# Stdio JSON-RPC serving surface.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine; mounts the llm runtime and the loop, and requires an explicit
# `workspaceContext` (Config | false) because it changes model-visible input.
# `false` = hermetic prompts (no workspace overview injected).
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false

# Native DeepSeek adapter. The key is never inlined: it resolves per request
# through the credential seam from the process environment this bin inherits.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled

# Managed child-process groups for the bash executor; required by the spine.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

# JSONL persistence; sessions land under ./.sessions inside this dir.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

# Persistence owns durable storage; this policy selects the request,
# tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Model-facing filesystem stack: fs-local (backend, paths from process.cwd()),
# fs-observation-policy (read-before-write contract tool-fs relies on), and
# tool-fs (registers fs.read/edit/write as model-facing tools). Without this
# trio the diff card — the shell's headline visualization — never renders.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
