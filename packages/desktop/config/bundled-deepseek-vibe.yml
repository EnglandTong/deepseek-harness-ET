# Bundled-standalone vibe leaf for the packaged desktop app: the real
# DeepSeek adapter plus the cordis self-modification tools, loaded by the
# single-file runtime exe (every bare name resolves inside its VFS). Needs
# `DEEPSEEK_API_KEY` in the shell environment (passed through on spawn).

# Stdio JSON-RPC serving surface.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine with a workspace overview so the model sees the workspace it
# is extending. `maxBytes` matches the base bundle's agent-instructions row.
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# Native DeepSeek adapter; the key resolves per request through the
# credential seam. Thinking pinned on for the shell's reasoning fold.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled

# Managed child-process groups for the bash executor; required by the spine.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

# JSONL persistence; $DSH_SESSION_ROOT points at the shell's per-user
# sessions directory (the bundled profile sets it before spawn).
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

# Persistence owns durable storage; this policy selects the request,
# tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Model-facing filesystem stack (see bundled-deepseek.yml); the workspace
# root follows $DSH_CWD.
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Self-referential tool suite: cordis_inspect / cordis_mount / cordis_unmount
# so the model can extend its own runtime (the shell renders these with the
# purpose-built self-modification card).
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
