# LEGACY leaf (alpha.4 anchoring): the sdk profile composes from
# $DSH_HOME/profiles/sdk bundle layers and takes no leaf argv, so the runtime
# never loads this file directly. It remains as the Plugins tab's legacy leaf
# view (fs-parse, static validation, boot history) for the stdio-vibe-deepseek
# profile.
#
# Vibe leaf, DeepSeek variant: the real DeepSeek adapter plus the cordis
# self-modification tools on stdio. Needs `DEEPSEEK_API_KEY` in the shell
# environment or `.env` at the DSH runtime root. Composition mirrors
# packages/bundle/sdk-minimal/cordis.yml with a workspace overview enabled
# (the model gets workspace context so it can write a plugin that extends its
# own runtime) and the cordis tool mounted.

# Stdio JSON-RPC serving surface.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

# Agent spine with a workspace overview, so the model sees the checkout it
# is extending. `maxBytes` matches the byte-budget pattern in
# examples/jsonrpc-agent tests and the base bundle's agent-instructions row.
- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext:
      maxBytes: 65536

# Native DeepSeek adapter; the key resolves per request through the
# credential seam. Thinking pinned on for the shell's reasoning fold.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled

# Managed child-process groups for the bash executor; required by the spine.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-local'

# JSONL persistence; sessions land under ./.sessions inside this dir.
- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: './.sessions'

# Persistence owns durable storage; this policy selects the request,
# tool-dispatch, and completed-step durability checkpoints.
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# Model-facing filesystem stack so file edits render the diff card and the
# model can read the checkout it is extending (see deepseek-jsonrpc.yml).
- id: fs-local
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# Self-referential tool suite: cordis_inspect / cordis_mount / cordis_unmount
# so the model can extend its own runtime (the shell renders these with the
# purpose-built self-modification card).
- id: tool-cordis
  name: '@deepseek-ai/dsh-tool-cordis'
